<!DOCTYPE html>
{% load i18n %}
{% load account %}
<html lang="en" data-bs-theme="auto">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="">
        <meta name="generator" content="Hugo 0.118.2">
        <title>
            {% block head_title %}{% endblock %} - LearningApp
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
              crossorigin="anonymous">
        <style>
            :root {
                --color-primary: #01FFFF; /* Electric Cyan */
                --color-primary-dark: #2AC6D0; /* Bright Teal */
                --color-primary-light: #E0FFFF; /* Light Cyan */
                --color-secondary: #FA9836; /* Bright Orange */
                --color-secondary-dark: #EA6400; /* Vivid Orange */
                --color-secondary-light: #FFB853; /* Soft Orange */
                --bg-primary: var(--color-primary-light);
                --bg-secondary: white;
                --border-color: #dadce0;
                --max-content-width: 800px;
            }
            
            body {
                background-color: var(--bg-primary);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                overflow-x: hidden;
                margin: 0;
                padding: 0;
            }
            
            .content-area {
                flex: 1;
                padding: 0;
                margin-left: 0; /* Default is no margin for all pages */
            }
            
            h1, h2, h3, h4, h5, h6 {
                color: var(--color-primary-dark);
                margin-bottom: 1rem;
            }
            
            .btn-primary {
                background-color: var(--color-primary-dark);
                border-color: var(--color-primary-dark);
            }
            
            .btn-primary:hover, .btn-primary:focus {
                background-color: var(--color-primary);
                border-color: var(--color-primary);
                color: #333;
            }
            
            .btn-danger {
                background-color: var(--color-secondary-dark);
                border-color: var(--color-secondary-dark);
            }
            
            .btn-success {
                background-color: var(--color-primary);
                border-color: var(--color-primary);
                color: #333;
            }
            
            .btn-outline-light:hover {
                background-color: var(--color-primary);
                color: #333;
            }
            
            .auth-icon {
                margin-right: 5px;
            }
            
            .siteName {
                font-weight: 700;
                letter-spacing: -1px;
                font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(45deg, var(--color-primary), var(--color-secondary));
                background-clip: text;
                -webkit-background-clip: text;
                color: transparent;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
                white-space: nowrap;
                line-height: 1.2;
                display: inline-block;
                font-size: 18px;
                text-decoration: none;
            }
            
            .section-title {
                position: relative;
                padding-bottom: 0.5rem;
                margin-bottom: 1.5rem;
                text-align: center;
            }
            
            .section-title::after {
                content: "";
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                bottom: 0;
                width: 100px;
                height: 3px;
                background-color: var(--color-secondary);
            }
            
            .form-control:focus {
                border-color: var(--color-primary-dark);
                box-shadow: 0 0 0 0.25rem rgba(42, 198, 208, 0.25);
            }
            
            .logoutButton {
                padding: 10px 20px;
                background-color: var(--color-secondary);
                color: white;
                border: none;
                border-radius: 4px;
                font-size: 16px;
                cursor: pointer;
                transition: background-color 0.2s ease;
                width: 100%;
                text-align: center;
                margin-top: auto;
                text-decoration: none;
                display: inline-block;
            }
            
            .logoutButton:hover {
                background-color: var(--color-secondary-dark);
                color: white;
                text-decoration: none;
            }
            
            .sidebarHeader {
                padding: 20px 15px;
                border-bottom: 1px solid var(--border-color);
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
            .content-container {
                max-width: var(--max-content-width);
                margin: 0 auto;
                padding: 2rem;
            }
            
            /* Dark theme support */
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg-secondary: #1e1e1e;
                    --border-color: #3d3d3d;
                    --text-primary: #f1f1f1;
                }
            }
        </style>
    </head>
    <body>
        <a class="visually-hidden-focusable" href="#content">{% translate "Skip to main content" %}</a>
        
        <div class="content-area">
            {% block body %}
                {% block content %}
                {% endblock content %}
            {% endblock body %}
        </div>
        
        {% block extra_body %}
        {% endblock extra_body %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
                crossorigin="anonymous"></script>
    </body>
</html>
